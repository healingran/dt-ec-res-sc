<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车路协同合屏视图 · EdgeTwin</title>

    <!--
      three-demo/cityVisualizer.js 使用 bare import「three」与「three/addons/...」，
      浏览器需通过 import map 映射到本地 ES 模块，否则会报无法解析模块。
      版本与 frontend/three-demo/package.json 中 three 保持一致。
    -->
    <script type="importmap">
    {
        "imports": {
            "three": "./three-demo/node_modules/three/build/three.module.js",
            "three/addons/": "./three-demo/node_modules/three/examples/jsm/"
        }
    }
    </script>

    <link rel="stylesheet" href="./css/monitor.css">
</head>
<body>

<!-- 左：3D（cityVisualizer 挂载 canvas） -->
<div id="left" aria-label="智能网联复杂交通三维孪生"></div>

<!-- 右：图表 -->
<div id="right">
    <div id="barChart" role="img" aria-label="CPU 柱状图"></div>
    <div id="lineChart" role="img" aria-label="CPU 折线图"></div>
    <div id="apiStatus" class="api-status" aria-live="polite"></div>
</div>

<script type="module" src="./js/monitor.js"></script>
</body>
</html>
