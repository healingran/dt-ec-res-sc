<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a1030">
    <title>复杂交通三维孪生 · EdgeTwin</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
        }
    }
    </script>
    <link rel="stylesheet" href="./css/scene-3d.css">
    <style>
        /* 视角按钮容器样式 - 悬浮右下角，不影响原有布局 */
        .view-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        .view-buttons button {
            background: #2c3e66;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 32px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .view-buttons button:hover {
            background: #1e2a4a;
            transform: scale(1.02);
        }
        .view-buttons button:active {
            transform: scale(0.98);
        }
        /* 保证原有样式不受影响 */
        .scene-wrap {
            position: relative;
        }
    </style>
</head>
<body>

<header class="scene-topbar">
    <a class="scene-back" href="index.html">← 返回首页</a>
    <span class="scene-title">智能网联 · 复杂交通场景</span>
    <nav class="scene-links">
        <a href="cpu-dashboard.html">CPU 负载大屏 →</a>
    </nav>
</header>

<div class="scene-wrap">
    <div id="scene3d" class="scene-viewport" aria-label="复杂交通三维孪生"></div>
    <p id="sceneStatus" class="scene-status" aria-live="polite"></p>
</div>

<!-- 视角切换按钮 -->
<div class="view-buttons">
    <button id="viewGlobal">🌍 全局视角</button>
    <button id="viewCongested">⚠️ 拥塞视角</button>
    <button id="viewBest">⭐ 最佳节点</button>
</div>

<script type="module" src="./js/scene-3d.js"></script>
</body>
</html>
