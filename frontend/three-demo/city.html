<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智慧城市数字孪生 - 现代玻璃幕墙建筑</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 18px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
            border-left: 4px solid #00aaff;
        }
        #load-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 12px 20px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            z-index: 100;
            border-right: 3px solid #ffaa00;
        }
        #time-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-family: monospace;
            pointer-events: none;
            z-index: 100;
        }
        @media (max-width: 600px) {
            #info { font-size: 10px; top: 10px; left: 10px; }
            #load-panel { font-size: 12px; bottom: 10px; right: 10px; }
            #time-panel { font-size: 10px; top: 10px; right: 10px; }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        🏙️ 现代玻璃幕墙城市 | 昼夜循环 | 磨砂质感建筑
    </div>
    <div id="load-panel">
        📈 预测负载: <span id="load-value">0.00</span>
    </div>
    <div id="time-panel">
        🌞 时间: <span id="time-display">12:00</span>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1030);
        scene.fog = new THREE.FogExp2(0x0a1030, 0.006);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(22, 14, 22);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 轨道控制 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.target.set(0, 3, 0);

        // ================= 1. 地面（带道路+绿化纹理） =================
        const groundSize = 90;
        const groundGeometry = new THREE.PlaneGeometry(groundSize, groundSize);
        
        // 生成高质量地面纹理（道路网格 + 绿化区域）
        const canvasGround = document.createElement('canvas');
        canvasGround.width = 2048;
        canvasGround.height = 2048;
        const ctxGround = canvasGround.getContext('2d');
        
        ctxGround.fillStyle = '#3a6b3a';
        ctxGround.fillRect(0, 0, canvasGround.width, canvasGround.height);
        
        const roadWidth = 40;
        const roadColor = '#4a4a4a';
        ctxGround.fillStyle = roadColor;
        const gridSpacing = 180;
        for (let x = 0; x <= canvasGround.width; x += gridSpacing) {
            ctxGround.fillRect(x - roadWidth/2, 0, roadWidth, canvasGround.height);
            ctxGround.fillRect(0, x - roadWidth/2, canvasGround.width, roadWidth);
        }
        
        ctxGround.fillStyle = '#dddddd';
        const crossSize = 50;
        for (let x = 0; x <= canvasGround.width; x += gridSpacing) {
            for (let y = 0; y <= canvasGround.height; y += gridSpacing) {
                ctxGround.fillRect(x - crossSize/2, y - crossSize/2, crossSize, crossSize);
            }
        }
        
        ctxGround.fillStyle = '#5b8c5b';
        for (let i = 0; i < 300; i++) {
            const rx = Math.random() * canvasGround.width;
            const ry = Math.random() * canvasGround.height;
            const radius = 15 + Math.random() * 25;
            ctxGround.beginPath();
            ctxGround.arc(rx, ry, radius, 0, Math.PI*2);
            ctxGround.fill();
        }
        
        ctxGround.fillStyle = '#6a8a6a';
        for (let i = 0; i < 2000; i++) {
            ctxGround.fillRect(Math.random() * canvasGround.width, Math.random() * canvasGround.height, 2, 2);
        }
        
        const groundTexture = new THREE.CanvasTexture(canvasGround);
        groundTexture.wrapS = THREE.RepeatWrapping;
        groundTexture.wrapT = THREE.RepeatWrapping;
        groundTexture.repeat.set(4, 4);
        
        // 为地面生成简易法线贴图（模拟碎石/粗糙地面）
        const groundNormalCanvas = document.createElement('canvas');
        groundNormalCanvas.width = 1024;
        groundNormalCanvas.height = 1024;
        const groundNormCtx = groundNormalCanvas.getContext('2d');
        // 法线贴图的默认颜色是 (128,128,255) 表示垂直向上
        groundNormCtx.fillStyle = '#8080ff';
        groundNormCtx.fillRect(0, 0, groundNormalCanvas.width, groundNormalCanvas.height);
        // 随机绘制一些凸起的点（模拟石子）
        for (let i = 0; i < 4000; i++) {
            const x = Math.random() * groundNormalCanvas.width;
            const y = Math.random() * groundNormalCanvas.height;
            // 法线贴图中，偏红表示右高，偏绿表示上高，偏蓝表示高度变化
            // 简单起见，随机画一些亮色点
            groundNormCtx.fillStyle = `rgb(128, 128, ${128 + Math.random() * 127})`;
            groundNormCtx.fillRect(x, y, 3, 3);
        }
        const groundNormalMap = new THREE.CanvasTexture(groundNormalCanvas);
        groundNormalMap.wrapS = THREE.RepeatWrapping;
        groundNormalMap.wrapT = THREE.RepeatWrapping;
        groundNormalMap.repeat.set(2, 2); // 让凹凸纹理重复多次，更细腻

        const groundMaterial = new THREE.MeshStandardMaterial({ map: groundTexture, roughness: 0.9, metalness: 0.1,normalMap: groundNormalMap });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.2;
        ground.receiveShadow = true;
        scene.add(ground);

       // ---------- 草地平面（使用专业贴图）----------
        const grassSize = groundSize - 2;
        const grassGeometry = new THREE.PlaneGeometry(grassSize, grassSize);

        // 加载贴图（确保 textures 文件夹与 HTML 文件在同一目录）
        const loader = new THREE.TextureLoader();
        const grassColorMap = loader.load('textures/Grass005_1K-JPG_Color.jpg');
        const grassNormalMap = loader.load('textures/Grass005_1K-JPG_NormalGL.jpg');
        const grassRoughnessMap = loader.load('textures/Grass005_1K-JPG_Roughness.jpg');
        // 建筑外墙贴图
        const facadeColorMap = loader.load('textures/Facade001_1K-JPG_Color.jpg');
        const facadeNormalMap = loader.load('textures/Facade001_1K-JPG_NormalGL.jpg');
        const facadeRoughnessMap = loader.load('textures/Facade001_1K-JPG_Roughness.jpg');
        facadeColorMap.wrapS = THREE.RepeatWrapping;
        facadeColorMap.wrapT = THREE.RepeatWrapping;
        facadeNormalMap.wrapS = THREE.RepeatWrapping;
        facadeNormalMap.wrapT = THREE.RepeatWrapping;
        facadeRoughnessMap.wrapS = THREE.RepeatWrapping;
        facadeRoughnessMap.wrapT = THREE.RepeatWrapping;
        // 道路贴图
        const roadColorMap = loader.load('textures/Road008B_1K-JPG_Color.jpg');
        const roadNormalMap = loader.load('textures/Road008B_1K-JPG_NormalGL.jpg');
        const roadRoughnessMap = loader.load('textures/Road008B_1K-JPG_Roughness.jpg');
        roadColorMap.wrapS = THREE.RepeatWrapping;
        roadColorMap.wrapT = THREE.RepeatWrapping;
        roadNormalMap.wrapS = THREE.RepeatWrapping;
        roadNormalMap.wrapT = THREE.RepeatWrapping;
        roadRoughnessMap.wrapS = THREE.RepeatWrapping;
        roadRoughnessMap.wrapT = THREE.RepeatWrapping;



        // 设置纹理重复方式（让草地更细腻）
        grassColorMap.wrapS = THREE.RepeatWrapping;
        grassColorMap.wrapT = THREE.RepeatWrapping;
        grassColorMap.repeat.set(4, 4);   // 重复次数，控制草地纹理密度

        grassNormalMap.wrapS = THREE.RepeatWrapping;
        grassNormalMap.wrapT = THREE.RepeatWrapping;
        grassNormalMap.repeat.set(4, 4);

        grassRoughnessMap.wrapS = THREE.RepeatWrapping;
        grassRoughnessMap.wrapT = THREE.RepeatWrapping;
        grassRoughnessMap.repeat.set(4, 4);

        const grassMaterial = new THREE.MeshStandardMaterial({
            map: grassColorMap,
            normalMap: grassNormalMap,
            roughnessMap: grassRoughnessMap,
            roughness: 0.9,
            metalness: 0.1
        });

        const grassPlane = new THREE.Mesh(grassGeometry, grassMaterial);
        grassPlane.rotation.x = -Math.PI / 2;
        grassPlane.position.y = -0.1;   // 略高于地面（原地面y=-0.2）
        grassPlane.receiveShadow = true;
        scene.add(grassPlane);
        
        // ================= 2. 绿化：随机小树 =================
        function createTree(x, z) {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.7 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 0.8, 6), trunkMat);
            trunk.position.y = 0.4;
            trunk.castShadow = true;
            group.add(trunk);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x5c9e5c, roughness: 0.5 });
            const leaf1 = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8), leafMat);
            leaf1.position.y = 0.9;
            leaf1.castShadow = true;
            group.add(leaf1);
            const leaf2 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8), leafMat);
            leaf2.position.y = 1.3;
            leaf2.castShadow = true;
            group.add(leaf2);
            const leaf3 = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8), leafMat);
            leaf3.position.y = 1.7;
            leaf3.castShadow = true;
            group.add(leaf3);
            group.position.set(x, 0, z);
            return group;
        }
        
        const treeCount = 150;
        for (let i = 0; i < treeCount; i++) {
            let x, z;
            do {
                x = (Math.random() - 0.5) * (groundSize - 8);
                z = (Math.random() - 0.5) * (groundSize - 8);
            } while (Math.hypot(x, z) < 12);
            const tree = createTree(x, z);
            scene.add(tree);
        }
        
        // ================= 3. 现代玻璃幕墙建筑（使用专业贴图） =================
        // 街区式建筑分布
        const buildings = [];
        const blockSize = 14;
        const buildingSpacing = 2.8;
        const buildingsPerBlock = 9;
        const blocks = [];

        for (let i = -3; i <= 3; i++) {
            for (let j = -3; j <= 3; j++) {
                if (Math.abs(i) <= 1 && Math.abs(j) <= 1) continue; // 中心广场留空
                blocks.push({ x: i * blockSize, z: j * blockSize });
            }
        }

        // ================= 道路模型（使用专业贴图） =================
        const roadModelWidth = 1.5;
        // 设置道路贴图重复次数
        roadColorMap.repeat.set(2, 2);
        roadNormalMap.repeat.set(2, 2);
        roadRoughnessMap.repeat.set(2, 2);

        const roadMaterial = new THREE.MeshStandardMaterial({
            map: roadColorMap,
            normalMap: roadNormalMap,
            roughnessMap: roadRoughnessMap,
            roughness: 0.7,
            metalness: 0.1
        });

        // 收集所有唯一的 X 坐标和 Z 坐标（从 blocks 中获取）
        const uniqueX = [...new Set(blocks.map(b => b.x))];
        const uniqueZ = [...new Set(blocks.map(b => b.z))];

        // 生成横向道路（沿 X 方向）
        uniqueX.forEach(x => {
            const zMin = Math.min(...blocks.filter(b => b.x === x).map(b => b.z));
            const zMax = Math.max(...blocks.filter(b => b.x === x).map(b => b.z));
            const roadLength = Math.abs(zMax - zMin) + blockSize;
            const roadGeo = new THREE.BoxGeometry(roadModelWidth, 0.1, roadLength);
            const road = new THREE.Mesh(roadGeo, roadMaterial);
            road.position.set(x, -0.08, (zMin + zMax) / 2);
            road.receiveShadow = true;
            scene.add(road);
        });

        // 生成纵向道路（沿 Z 方向）
        uniqueZ.forEach(z => {
            const xMin = Math.min(...blocks.filter(b => b.z === z).map(b => b.x));
            const xMax = Math.max(...blocks.filter(b => b.z === z).map(b => b.x));
            const roadLength = Math.abs(xMax - xMin) + blockSize;
            const roadGeo = new THREE.BoxGeometry(roadLength, 0.1, roadModelWidth);
            const road = new THREE.Mesh(roadGeo, roadMaterial);
            road.position.set((xMin + xMax) / 2, -0.08, z);
            road.receiveShadow = true;
            scene.add(road);
        });

        // 生成建筑（使用外墙贴图）
        blocks.forEach(block => {
            for (let k = 0; k < buildingsPerBlock; k++) {
                // 随机偏移，避免完全对齐
                const offsetX = (Math.random() - 0.5) * (blockSize - buildingSpacing);
                const offsetZ = (Math.random() - 0.5) * (blockSize - buildingSpacing);
                let x = block.x + offsetX;
                let z = block.z + offsetZ;
                // 避免建筑重叠
                let overlap = false;
                for (let b of buildings) {
                    if (Math.hypot(b.userData.x - x, b.userData.z - z) < 1.2) {
                        overlap = true;
                        break;
                    }
                }
                if (overlap) continue;

                const height = 3 + Math.random() * 15;
                const width = 0.8 + Math.random() * 1.2;
                const depth = 0.8 + Math.random() * 1.2;
                const geometry = new THREE.BoxGeometry(width, height, depth);

                // 根据建筑尺寸调整贴图重复次数（让纹理比例合理）
                const repeatX = Math.max(1, Math.floor(width * 1.5));
                const repeatY = Math.max(1, Math.floor(height * 2.0));
                facadeColorMap.repeat.set(repeatX, repeatY);
                facadeNormalMap.repeat.set(repeatX, repeatY);
                facadeRoughnessMap.repeat.set(repeatX, repeatY);

                const material = new THREE.MeshStandardMaterial({
                    map: facadeColorMap,
                    normalMap: facadeNormalMap,
                    roughnessMap: facadeRoughnessMap,
                    roughness: 0.6,
                    metalness: 0.2,
                    color: 0xffffff,     // 白色，完全显示贴图颜色
                    emissive: new THREE.Color(0x111111),   // 这个可以调高一点
                    emissiveIntensity: 0.1                // 增加这个值
                });

                const building = new THREE.Mesh(geometry, material);
                building.position.set(x, height/2, z);
                building.castShadow = true;
                building.receiveShadow = true;
                building.userData = { x, z };
                scene.add(building);
                buildings.push(building);
            }
        });

        // 超高层地标（保留原材质，可根据需要后续换成贴图）
        const towerPositions = [
            [-18, -18], [18, -18], [-18, 18], [18, 18],
            [-22, 0], [22, 0], [0, -22], [0, 22]
        ];
        towerPositions.forEach(pos => {
            const [x, z] = pos;
            const height = 20 + Math.random() * 8;
            const geometry = new THREE.BoxGeometry(1.5, height, 1.5);
            const material = new THREE.MeshStandardMaterial({
                color: 0x88aaff,
                metalness: 0.9,
                roughness: 0.3,
                emissive: 0x224466,
                emissiveIntensity: 0.2
            });
            const tower = new THREE.Mesh(geometry, material);
            tower.position.set(x, height/2, z);
            tower.castShadow = true;
            scene.add(tower);
            buildings.push(tower);
        });
        
        // ================= 4. 设备模型（保留并优化） =================
        const baseStation = new THREE.Group();
        const bodyMatDevice = new THREE.MeshStandardMaterial({ color: 0x4477aa, metalness: 0.7, roughness: 0.4 });
        const bodyDevice = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 1.2), bodyMatDevice);
        bodyDevice.position.y = 1.1;
        bodyDevice.castShadow = true;
        baseStation.add(bodyDevice);
        const antennaMatDevice = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        const antennaDevice = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.2), antennaMatDevice);
        antennaDevice.position.set(0, 2.3, 0);
        antennaDevice.castShadow = true;
        baseStation.add(antennaDevice);
        const topMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff4422, emissiveIntensity: 0.5 });
        const topSphere = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8), topMat);
        topSphere.position.set(0, 2.9, 0);
        baseStation.add(topSphere);
        baseStation.position.set(-11, 0, -9);
        baseStation.castShadow = true;
        scene.add(baseStation);
        
        const cameraGroup = new THREE.Group();
        const camBodyMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.6 });
        const camBody = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 1.4), camBodyMat);
        camBody.position.y = 0.35;
        camBody.castShadow = true;
        cameraGroup.add(camBody);
        const lensMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x2266aa, emissiveIntensity: 0.4 });
        const lens = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16), lensMat);
        lens.position.set(0, 0.35, 0.8);
        lens.castShadow = true;
        cameraGroup.add(lens);
        const standMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
        const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.6), standMat);
        stand.position.set(0, -0.2, 0);
        stand.castShadow = true;
        cameraGroup.add(stand);
        cameraGroup.position.set(9, 0.7, 7);
        cameraGroup.rotation.y = -0.5;
        scene.add(cameraGroup);
        
        const rsuGroup = new THREE.Group();
        const poleMatRsu = new THREE.MeshStandardMaterial({ color: 0x888888 });
        const poleRsu = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 2.5), poleMatRsu);
        poleRsu.position.y = 1.25;
        poleRsu.castShadow = true;
        rsuGroup.add(poleRsu);
        const armMatRsu = new THREE.MeshStandardMaterial({ color: 0x2266aa });
        const armRsu = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.15, 0.3), armMatRsu);
        armRsu.position.set(0, 2.6, 0);
        armRsu.castShadow = true;
        rsuGroup.add(armRsu);
        const boxMatRsu = new THREE.MeshStandardMaterial({ color: 0x44aaff, emissive: 0x004466, emissiveIntensity: 0.3 });
        const boxRsu = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.4, 0.5), boxMatRsu);
        boxRsu.position.set(0, 2.9, 0);
        boxRsu.castShadow = true;
        rsuGroup.add(boxRsu);
        rsuGroup.position.set(4, 0, -10);
        scene.add(rsuGroup);
        
        const devices = [baseStation, cameraGroup, rsuGroup];
        
        // ================= 5. 路灯 =================
        const streetLamps = [];
        const lampMatBody = new THREE.MeshStandardMaterial({ color: 0xccaa77, metalness: 0.5 });
        const lampMatLight = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff4422, emissiveIntensity: 0.6 });
        for (let i = 0; i < 40; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 16 + Math.random() * 14;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2.5, 6), lampMatBody);
            pole.position.set(x, 1.25, z);
            pole.castShadow = true;
            scene.add(pole);
            const lampSphere = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8), lampMatLight);
            lampSphere.position.set(x, 2.6, z);
            lampSphere.castShadow = true;
            scene.add(lampSphere);
            streetLamps.push(lampSphere);
        }
        
        // ================= 6. 昼夜循环与照明 =================
        let timeOfDay = 12;
        let cycleSpeed = 0.003;
        
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(10, 20, 5);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -15;
        sunLight.shadow.camera.right = 15;
        sunLight.shadow.camera.top = 15;
        sunLight.shadow.camera.bottom = -15;
        scene.add(sunLight);
        
        const ambientLight = new THREE.AmbientLight(0x404060, 0.7);
        scene.add(ambientLight);
        
        const fillLight = new THREE.PointLight(0xffaa66, 0.5);
        fillLight.position.set(-8, 8, -10);
        scene.add(fillLight);
        
        // 星星
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1200;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 200;
            starPositions[i*3+1] = (Math.random() - 0.5) * 40 + 20;
            starPositions[i*3+2] = (Math.random() - 0.5) * 120 - 60;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // 月亮
        const moonMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, emissive: 0x444444 });
        const moon = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), moonMat);
        scene.add(moon);
        
        const timeDisplay = document.getElementById('time-display');
        /** 后端 API（与 main.py 里 uvicorn 端口一致） */
        const API_BASE = 'http://127.0.0.1:8000';
        let cpuLoad = 0.5;
        let displayLoad = 0.5;
        let loadFromApi = false;
        const loadSpan = document.getElementById('load-value');

        async function refreshLoadFromApi() {
            try {
                const res = await fetch(`${API_BASE}/predict?steps=10`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const vals = data.predicted_load;
                if (!Array.isArray(vals) || vals.length === 0) throw new Error('无预测数据');
                const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
                displayLoad = avg;
                cpuLoad = Math.min(1, Math.max(0, avg / 12));
                loadFromApi = true;
            } catch (e) {
                console.warn('后端 /predict 不可用，使用页面内模拟负载:', e.message);
                loadFromApi = false;
            }
        }
        refreshLoadFromApi();
        setInterval(refreshLoadFromApi, 8000);
        
        function animateCamera() {
            cameraGroup.rotation.y = -0.5 + Math.sin(Date.now() * 0.001) * 0.3;
        }
        
        function updateDayNightCycle() {
            timeOfDay += cycleSpeed;
            if (timeOfDay >= 24) timeOfDay -= 24;
            const angleRad = (timeOfDay / 24) * Math.PI * 2;
            const sunHeight = Math.sin(angleRad);
            const sunX = Math.cos(angleRad) * 28;
            const sunZ = Math.sin(angleRad) * 28;
            const sunY = Math.max(0, sunHeight * 22);
            sunLight.position.set(sunX, sunY + 5, sunZ);
            
            const intensityFactor = Math.max(0, Math.sin(angleRad) * 1.2);
            sunLight.intensity = Math.min(1.5, intensityFactor * 1.5);
            ambientLight.intensity = 0.7 + intensityFactor * 0.45;
            fillLight.intensity = 0.3 + (1 - intensityFactor) * 0.4;
            
            const skyColor = new THREE.Color().setHSL(0.58, 0.7, 0.2 + intensityFactor * 0.3);
            scene.background = skyColor;
            scene.fog.color = skyColor;
            
            const starOpacity = Math.max(0, 1 - intensityFactor * 1.5);
            starMaterial.opacity = starOpacity;
            
            const moonAngle = angleRad + Math.PI;
            const moonX = Math.cos(moonAngle) * 35;
            const moonZ = Math.sin(moonAngle) * 35;
            const moonY = Math.sin(moonAngle) * 18;
            moon.position.set(moonX, moonY, moonZ);
            
            const nightFactor = 1 - intensityFactor;
            streetLamps.forEach(lamp => {
                if (lamp.material) lamp.material.emissiveIntensity = 0.3 + nightFactor * 0.7;
            });
            buildings.forEach(building => {
                if (building.material) {
                    building.material.emissiveIntensity = 0.15 + nightFactor * 0.4;
                }
            });
            if (topSphere.material) topSphere.material.emissiveIntensity = 0.4 + nightFactor * 0.6;
            if (boxRsu.material) boxRsu.material.emissiveIntensity = 0.3 + nightFactor * 0.5;
            if (lens.material) lens.material.emissiveIntensity = 0.3 + nightFactor * 0.5;
            
            if (intensityFactor < 0.3) {
                sunLight.color.setHex(0xffaa77);
            } else if (intensityFactor > 0.7) {
                sunLight.color.setHex(0xfff5e0);
            } else {
                sunLight.color.setHex(0xffddbb);
            }
            
            const hour = Math.floor(timeOfDay);
            const minute = Math.floor((timeOfDay - hour) * 60);
            timeDisplay.textContent = `${hour.toString().padStart(2,'0')}:${minute.toString().padStart(2,'0')}`;
        }
        
        function updateLoadAndColors() {
            if (!loadFromApi) {
                cpuLoad = 0.5 + Math.sin(Date.now() * 0.003) * 0.3;
                displayLoad = cpuLoad;
            }
            loadSpan.textContent = displayLoad.toFixed(2);
            const r = Math.min(1, cpuLoad * 2);
            const g = Math.min(1, 2 - cpuLoad * 2);
            const b = 0.3;
            devices.forEach(device => {
                device.traverse(child => {
                    if (child.isMesh && child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => {
                                if (mat.color) mat.color.setRGB(r, g, b);
                            });
                        } else {
                            if (child.material.color) child.material.color.setRGB(r, g, b);
                        }
                    }
                });
            });
        }
        
        function animate() {
            requestAnimationFrame(animate);
            updateDayNightCycle();
            updateLoadAndColors();
            animateCamera();
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('现代玻璃幕墙城市已加载');
    </script>
</body>
</html>
